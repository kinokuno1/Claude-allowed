name: Build Tunio for Windows

on:
  push:
    paths:
      - 'tunio-desktop/**'
      - '.github/workflows/build-tunio-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tunio-desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Engine check against the real sites (informational)
        continue-on-error: true
        run: |
          python -c "from tunio_desktop import engine; print('yt-dlp', engine.version(), 'deno', engine._bundled('deno'), 'ffmpeg', engine.ffmpeg_path())"
          python -c "from tunio_desktop import engine; r=engine.search('YOUTUBE','daft punk get lucky',3); print([t.title for t in r]); s=engine.stream(r[0].url); print('stream ok' if s else 'no stream')"

      - name: Bundle ffmpeg, deno and the icon
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ff bin/ffmpeg.exe
          $deno = (Get-Command deno -ErrorAction SilentlyContinue).Source
          if (-not $deno) { $deno = python -c "import deno; print(deno.find_deno_bin())" }
          Copy-Item $deno bin/deno.exe
          python tools/make_icon.py bin/tunio.ico
          Get-ChildItem bin

      - name: Build Tunio.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name Tunio
          --icon bin/tunio.ico
          --add-data "tunio_desktop/web;tunio_desktop/web"
          --add-binary "bin/ffmpeg.exe;."
          --add-binary "bin/deno.exe;."
          --collect-data yt_dlp_ejs
          --collect-submodules yt_dlp
          --hidden-import webview.platforms.edgechromium
          run_tunio.py

      - name: Smoke test (exe starts its engine and serves the UI)
        run: |
          $env:TUNIO_BROWSER = ""
          python -c "from tunio_desktop import server; h,u=server.start(); import urllib.request; print(urllib.request.urlopen(u).status)"
          Get-Item dist/Tunio.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Tunio-Windows
          path: tunio-desktop/dist/Tunio.exe

      - name: Publish to the tunio-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tunio-latest
          prerelease: true
          make_latest: false
          files: tunio-desktop/dist/Tunio.exe
