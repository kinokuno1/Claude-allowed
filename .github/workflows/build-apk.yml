name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the Android SDK (ANDROID_HOME).
      - run: ./gradlew --no-daemon test assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MaMoyenne-apk
          path: app/build/outputs/apk/release/*.apk
