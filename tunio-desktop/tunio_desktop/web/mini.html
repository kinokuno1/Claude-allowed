<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunio mini player</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<div id="mini" class="empty">
  <div class="bg"><img id="bgimg" alt=""></div>
  <div class="cover" id="cover"><img id="cimg" alt="" referrerpolicy="no-referrer"></div>
  <div class="info">
    <div class="t" id="title">Nothing playing</div>
    <div class="a" id="artist"></div>
    <div class="prog"><span id="tc">0:00</span><div class="bar" id="bar"><i id="fill"></i></div><span id="td">0:00</span></div>
  </div>
  <div class="ctrls">
    <button id="like" title="Like"></button>
    <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zm3.66 6.82 5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07a1 1 0 0 0 0 1.64z"/></svg></button>
    <button id="play" class="main" title="Play/pause"><svg class="ppi" viewBox="0 0 24 24"><path class="pa"/><path class="pb"/></svg></button>
    <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="m7.58 16.89 5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82zM16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg></button>
  </div>
  <div class="win">
    <button id="expand" title="Open Tunio"><svg viewBox="0 0 24 24"><path d="M5 5h6v2H7v4H5V5zm14 14h-6v-2h4v-4h2v6z"/></svg></button>
    <button id="close" class="close" title="Quit Tunio"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1 1 9"/></svg></button>
  </div>
</div>
<div id="edges"><i data-e="n"></i><i data-e="s"></i><i data-e="w"></i><i data-e="e"></i><i data-e="nw"></i><i data-e="ne"></i><i data-e="sw"></i><i data-e="se"></i></div>
<script type="module" src="mini.js"></script>
</body>
</html>
