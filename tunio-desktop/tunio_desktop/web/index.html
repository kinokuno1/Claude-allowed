<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Desktop layout: top bar, library sidebar, main view, now-playing panel, player bar.
     Colours follow 60-30-10: 60 % dominant (main view), 30 % secondary (sidebar, panel, bar, cards), 10 % accent. -->
<div id="app">
  <header id="top">
    <div class="nav">
      <button class="round" id="hback" title="Back (Alt+←)"></button>
      <button class="round" id="hfwd" title="Forward (Alt+→)"></button>
    </div>
    <div class="center">
      <button class="round big" id="hhome" title="Home"></button>
      <label class="searchbox" id="searchbox">
        <span id="sicon"></span>
        <input id="q" placeholder="What do you want to play? Search or paste a link" autocomplete="off" spellcheck="false">
        <button class="round small hidden" id="qclear" title="Clear"></button>
      </label>
    </div>
    <div class="nav end">
      <button class="round" id="hsettings" title="Settings"></button>
    </div>
  </header>

  <aside id="side" aria-label="Your Library"></aside>
  <main id="screen" tabindex="-1"></main>
  <aside id="np" aria-label="Now playing"></aside>
  <footer id="bar" aria-label="Player"></footer>
</div>

<div id="toasts"></div>
<div id="modal" class="hidden"></div>
<div id="menu" class="hidden"></div>
<audio id="audio" preload="auto"></audio>

<script type="module" src="app.js"></script>
</body>
</html>
