plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.notes.moyenne'
    compileSdk 34

    defaultConfig {
        applicationId 'ch.notes.moyenne'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Shared key so every build (local or CI) can update an installed copy without losing data.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
